<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="JobFit AI">
  <!-- Solid mark — reads at 16px favicon size -->
  <rect width="32" height="32" rx="8" fill="#007AFF"/>
  <!-- Antenna -->
  <line x1="16" y1="9" x2="16" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="4.5" r="1.75" fill="#FFFFFF"/>
  <!-- Head -->
  <rect x="8" y="9" width="16" height="12" rx="4" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="1.75"/>
  <!-- Eyes -->
  <rect x="11.25" y="13" width="3.25" height="3.25" rx="0.9" fill="#FFFFFF"/>
  <rect x="17.5" y="13" width="3.25" height="3.25" rx="0.9" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M12.5 18.25 Q16 20.5 19.5 18.25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <rect x="10.5" y="22" width="11" height="5.5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
